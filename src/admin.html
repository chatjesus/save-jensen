<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Save Jensen · 留言管理</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/admin.css">
</head>
<body class="adm">
<main class="wrap">
  <h1>留言管理</h1>
  <p class="note">仅管理员使用。令牌只保存在这个页面的内存里，刷新或关闭即失效；不会写入地址栏、Cookie 或本地存储。</p>
  <form id="auth" autocomplete="off">
    <label for="tok">管理员令牌（ADMIN_TOKEN）</label>
    <div class="srow">
      <input type="password" id="tok" autocomplete="off" spellcheck="false" required>
      <button class="btn pri" type="submit">进入</button>
    </div>
  </form>
  <p class="note livemsg" id="msg" aria-live="polite"></p>
  <section id="panel" hidden>
    <p id="stats" class="note"></p>
    <div class="chips" role="group" aria-label="状态" id="tabs">
      <button class="chip" data-s="pending" aria-pressed="false">历史待审</button>
      <button class="chip" data-s="approved" aria-pressed="true">已发布</button>
      <button class="chip" data-s="hidden" aria-pressed="false">已隐藏</button>
      <button class="chip" data-s="withdrawn" aria-pressed="false">已撤回</button>
      <button class="chip" id="reload" type="button">刷新</button>
      <button class="chip" id="lock" type="button">退出</button>
    </div>
    <ul id="list"></ul>
    <h2>上榜资料</h2><label for="profileQuery">查找昵称或资料 ID</label><input id="profileQuery" type="text" maxlength="64" placeholder="留空显示最近 100 条"><button class="btn sm" id="loadProfiles" type="button">读取上榜资料</button><ul id="profiles"></ul>
    <p class="note">新留言通过自动文字过滤后立即发布。隐藏：从公开留言墙移除；通过：恢复展示。已撤回的留言不能恢复。自动检查不能识别所有问题，请留意隐私、骚扰、垃圾广告和冒充官方；礼貌表达不同意见可以保留。</p>
  </section>
</main>
<script src="../assets/admin.js" defer></script>
</body>
</html>
